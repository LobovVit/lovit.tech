name: Deploy Backend (Home via VPS Bastion)

on:
  push:
    branches: [ "develop" ]
    paths:
      - "backend/**"
      - "docker-compose.backend.yml"
      - ".github/workflows/deploy-backend-docker.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name & tag
        id: meta
        run: |
          REPO="${{ github.repository }}"
          echo "image=ghcr.io/${REPO,,}/backend" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}

  deploy-home-via-vps:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout (for compose file)
        uses: actions/checkout@v4

      - name: Install rsync and ssh-client
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Prepare SSH keys and config (ProxyJump)
        run: |
          mkdir -p ~/.ssh
          # VPS key
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          # HOME key
          echo "${{ secrets.HOME_SSH_KEY }}" > ~/.ssh/home_key
          chmod 600 ~/.ssh/home_key

          # SSH config: define hosts and ProxyJump chain
          cat > ~/.ssh/config << 'EOF'
          Host vps
            HostName ${VPS_HOST}
            User ${VPS_USER}
            IdentityFile ~/.ssh/vps_key
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 6

          Host home
            HostName ${HOME_HOST}
            User ${HOME_USER}
            IdentityFile ~/.ssh/home_key
            ProxyJump vps
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF

        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          HOME_HOST: ${{ secrets.HOME_HOST }}
          HOME_USER: ${{ secrets.HOME_USER }}

      - name: Create app dir on HOME
        run: |
          ssh -F ~/.ssh/config home "mkdir -p '${{ secrets.HOME_APP_DIR }}'"

      - name: Upload compose to HOME
        run: |
          rsync -avz -e "ssh -F ~/.ssh/config" docker-compose.backend.yml \
            home:${{ secrets.HOME_APP_DIR }}/docker-compose.backend.yml

      - name: Pull & restart on HOME
        env:
          APP_DIR: ${{ secrets.HOME_APP_DIR }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}/backend
        run: |
          ssh -F ~/.ssh/config home bash -lc "
            cd '${APP_DIR}' &&
            docker login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}' &&
            docker compose -f docker-compose.backend.yml pull &&
            docker compose -f docker-compose.backend.yml up -d &&
            docker image prune -f
          "