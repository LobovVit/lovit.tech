name: Deploy Backend (Docker via VPS proxy)

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - "docker-compose.backend.yml"
      - ".github/workflows/deploy-backend-docker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}

      HOME_HOST: ${{ secrets.HOME_HOST }}
      HOME_USER: ${{ secrets.HOME_USER }}
      HOME_SSH_KEY: ${{ secrets.HOME_SSH_KEY }}
      HOME_SSH_PORT: ${{ secrets.HOME_SSH_PORT }}

      HOME_APP_DIR: "/opt/lovit/backend"
      HOME_COMPOSE_FILE: "docker-compose.backend.yml"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make build version (changes every run)
        run: |
          short_sha="${GITHUB_SHA::7}"
          ts="$(date +%Y%m%d%H%M%S)"
          echo "BUILD_VERSION=${short_sha}-${ts}" >> "$GITHUB_ENV"
          echo "Build version: ${short_sha}-${ts}"

      - name: Prepare SSH (keys, config, known_hosts)
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # приватные ключи (сохраняем с переносами строк!)
          echo "$VPS_SSH_KEY"  > "$HOME/.ssh/vps_key"
          echo "$HOME_SSH_KEY" > "$HOME/.ssh/home_key"
          chmod 600 "$HOME/.ssh/vps_key" "$HOME/.ssh/home_key"

          VPS_SSH_PORT="${VPS_SSH_PORT:-22}"
          HOME_SSH_PORT="${HOME_SSH_PORT:-22}"

          # ssh config
          cat > "$HOME/.ssh/config" <<CFG
  Host vps
  HostName ${VPS_HOST}
  User ${VPS_USER}
  Port ${VPS_SSH_PORT}
  IdentityFile ~/.ssh/vps_key
  IdentitiesOnly yes
  UserKnownHostsFile ~/.ssh/known_hosts
  
  Host home
  HostName ${HOME_HOST}
  User ${HOME_USER}
  Port ${HOME_SSH_PORT}
  IdentityFile ~/.ssh/home_key
  IdentitiesOnly yes
  UserKnownHostsFile ~/.ssh/known_hosts
  ProxyJump vps
  CFG
  
  # known_hosts
  ssh-keyscan -H -p "$VPS_SSH_PORT" "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
  ssh -F "$HOME/.ssh/config" vps "ssh-keyscan -H -p '$HOME_SSH_PORT' '$HOME_HOST'" >> "$HOME/.ssh/known_hosts"
  chmod 600 "$HOME/.ssh/known_hosts"

- name: Sanity check SSH
  run: |
    ssh -F "$HOME/.ssh/config" vps  "echo '✅ VPS OK:'  \$(hostname)"
    ssh -F "$HOME/.ssh/config" home "echo '✅ HOME OK:' \$(hostname)"

- name: Ensure remote dirs
  run: ssh -F "$HOME/.ssh/config" home "mkdir -p '${HOME_APP_DIR}/backend'"

- name: Rsync docker-compose to HOME
  run: rsync -avz --delete -e "ssh -F $HOME/.ssh/config" docker-compose.backend.yml home:"${HOME_APP_DIR}/"

- name: Rsync backend sources to HOME
  run: rsync -avz --delete -e "ssh -F $HOME/.ssh/config" backend/ home:"${HOME_APP_DIR}/backend/"

- name: Deploy on HOME (docker compose build & up)
  env:
    BUILD_VERSION: ${{ env.BUILD_VERSION }}
  run: |
    ssh -F "$HOME/.ssh/config" home "
      set -euo pipefail
      cd '${HOME_APP_DIR}'
      export BUILD_VERSION='${BUILD_VERSION}'
      echo '🔖 BUILD_VERSION='$BUILD_VERSION
      docker compose -f '${HOME_COMPOSE_FILE}' build --pull backend
      docker compose -f '${HOME_COMPOSE_FILE}' up -d --build --remove-orphans
      docker image prune -af || true
      docker compose -f '${HOME_COMPOSE_FILE}' ps
      docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
    "