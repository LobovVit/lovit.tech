name: Deploy Backend (Docker via VPS)

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - "docker-compose.backend.yml"
      - ".github/workflows/deploy-backend-docker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      HOME_HOST: ${{ secrets.HOME_HOST }}
      HOME_USER: ${{ secrets.HOME_USER }}
      HOME_SSH_PORT: ${{ secrets.HOME_SSH_PORT }}
      HOME_APP_DIR: "/opt/lovit/backend"
      HOME_COMPOSE_FILE: "docker-compose.backend.yml"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH (keys, config, known_hosts)
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Пишем приватные ключи
          echo "${{ secrets.VPS_SSH_KEY }}"  > "$HOME/.ssh/vps_key"
          echo "${{ secrets.HOME_SSH_KEY }}" > "$HOME/.ssh/home_key"
          chmod 600 "$HOME/.ssh/vps_key" "$HOME/.ssh/home_key"

          # Дефолты портов, если секреты пусты
          VPS_SSH_PORT="${VPS_SSH_PORT:-22}"
          HOME_SSH_PORT="${HOME_SSH_PORT:-22}"

          # Пишем SSH config (ВАЖНО: без одинарных кавычек, чтобы подставились переменные)
          cat > "$HOME/.ssh/config" <<CFG
          Host vps
            HostName ${VPS_HOST}
            User ${VPS_USER}
            Port ${VPS_SSH_PORT}
            IdentityFile ~/.ssh/vps_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts

          Host home
            HostName ${HOME_HOST}
            User ${HOME_USER}
            Port ${HOME_SSH_PORT}
            IdentityFile ~/.ssh/home_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ProxyJump vps
          CFG

          # known_hosts для VPS
          ssh-keyscan -H -p "$VPS_SSH_PORT" "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

          # known_hosts для HOME (через VPS)
          ssh -F "$HOME/.ssh/config" vps "ssh-keyscan -H -p '$HOME_SSH_PORT' '$HOME_HOST'" >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Sanity check SSH connections
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$HOME/.ssh/config" vps  "echo '✅ VPS OK:'  \$(hostname)"
          ssh -F "$HOME/.ssh/config" home "echo '✅ HOME OK:' \$(hostname)"

      - name: Ensure target dir on HOME
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$HOME/.ssh/config" home "mkdir -p '${HOME_APP_DIR}' '${HOME_APP_DIR}/backend'"

      - name: Rsync docker-compose to HOME
        shell: bash
        run: |
          set -euo pipefail
          rsync -avz --delete -e "ssh -F $HOME/.ssh/config" \
            docker-compose.backend.yml \
            home:"${HOME_APP_DIR}/"

      - name: Rsync backend sources to HOME
        shell: bash
        run: |
          set -euo pipefail
          rsync -avz --delete -e "ssh -F $HOME/.ssh/config" \
            backend/ \
            home:"${HOME_APP_DIR}/backend/"

      - name: Deploy on HOME with Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$HOME/.ssh/config" home "
            set -euo pipefail
            cd '${HOME_APP_DIR}'

            echo '📦 docker compose pull (если есть registry)...'
            docker compose -f '${HOME_COMPOSE_FILE}' pull || true

            echo '🔧 docker compose build backend...'
            docker compose -f '${HOME_COMPOSE_FILE}' build backend || true

            echo '🚀 docker compose up -d...'
            docker compose -f '${HOME_COMPOSE_FILE}' up -d --remove-orphans

            echo '🔎 docker compose ps:'
            docker compose -f '${HOME_COMPOSE_FILE}' ps

            echo '🔎 docker ps:'
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          "