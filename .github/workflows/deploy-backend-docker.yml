name: Deploy Backend (Docker via VPS Jump)

on:
  push:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - 'docker-compose.backend.yml'
      - '.github/workflows/deploy-backend-docker.yml'

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install rsync & ssh client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rsync openssh-client

      - name: Prepare SSH keys
        env:
          VPS_SSH_KEY:  ${{ secrets.VPS_SSH_KEY }}
          HOME_SSH_KEY: ${{ secrets.HOME_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$VPS_SSH_KEY"  > ~/.ssh/vps_key
          echo "$HOME_SSH_KEY" > ~/.ssh/home_key
          chmod 600 ~/.ssh/vps_key ~/.ssh/home_key

      - name: Write SSH config (aliases: vps, home)
        env:
          VPS_HOST:        ${{ secrets.VPS_HOST }}
          VPS_USER:        ${{ secrets.VPS_USER }}
          HOME_HOST:       ${{ secrets.HOME_HOST }}
          HOME_USER:       ${{ secrets.HOME_USER }}
          HOME_SSH_PORT:   ${{ secrets.HOME_SSH_PORT }}
        run: |
          PORT=${HOME_SSH_PORT:-22}
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${VPS_HOST}
            User ${VPS_USER}
            IdentityFile ~/.ssh/vps_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            GlobalKnownHostsFile /dev/null
            LogLevel ERROR

          Host home
            HostName ${HOME_HOST}
            User ${HOME_USER}
            Port ${PORT}
            IdentityFile ~/.ssh/home_key
            IdentitiesOnly yes
            ProxyJump vps
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            GlobalKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 6
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify SSH connectivity (VPS)
        run: ssh vps "echo VPS OK: \$(hostname)"

      - name: Verify SSH connectivity (HOME via ProxyJump)
        run: ssh home "echo HOME OK: \$(hostname)"

      - name: Ensure target directory on HOME
        env:
          HOME_BACKEND_PATH: ${{ secrets.HOME_BACKEND_PATH }}
        run: ssh home "mkdir -p '${HOME_BACKEND_PATH}'"

      - name: Rsync docker-compose to HOME
        env:
          HOME_BACKEND_PATH: ${{ secrets.HOME_BACKEND_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh" \
            docker-compose.backend.yml \
            home:"${HOME_BACKEND_PATH}/"

      - name: Rsync backend sources to HOME
        env:
          HOME_BACKEND_PATH: ${{ secrets.HOME_BACKEND_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh" \
            backend/ \
            home:"${HOME_BACKEND_PATH}/backend/"

      - name: Docker Compose up on HOME
        env:
          HOME_BACKEND_PATH: ${{ secrets.HOME_BACKEND_PATH }}
        run: |
          ssh home bash -lc "
            set -euo pipefail
            cd '${HOME_BACKEND_PATH}'
            docker compose -f docker-compose.backend.yml pull || true
            docker compose -f docker-compose.backend.yml build --pull
            docker compose -f docker-compose.backend.yml up -d
            docker compose -f docker-compose.backend.yml ps
          "