name: Deploy Backend (Docker via VPS ProxyJump)

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'docker-compose.backend.yml'
      - '.github/workflows/deploy-backend-docker.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync & OpenSSH client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rsync openssh-client

      - name: Write SSH keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}"  > ~/.ssh/vps_key
          printf '%s\n' "${{ secrets.HOME_SSH_KEY }}" > ~/.ssh/home_key
          chmod 600 ~/.ssh/vps_key ~/.ssh/home_key

      - name: Add known_hosts for VPS and HOME
        run: |
          touch ~/.ssh/known_hosts
          # VPS fingerprint
          ssh-keyscan -p 22 -T 10 "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          # HOME fingerprint через VPS (ProxyJump)
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "ssh-keyscan -p 22 -T 10 '${{ secrets.HOME_HOST }}'" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH connectivity (VPS and HOME via ProxyJump)
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "echo VPS OK: \$(hostname)"
          ssh -i ~/.ssh/home_key -J "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" -o StrictHostKeyChecking=yes \
            "${{ secrets.HOME_USER }}@${{ secrets.HOME_HOST }}" "echo HOME OK: \$(hostname)"

      - name: Ensure remote target dir on HOME
        env:
          HOME_BACKEND_PATH: ${{ secrets.HOME_BACKEND_PATH }}
        run: |
          ssh -i ~/.ssh/home_key -J "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "${{ secrets.HOME_USER }}@${{ secrets.HOME_HOST }}" \
            "mkdir -p '${HOME_BACKEND_PATH}'"

      - name: Rsync compose file to HOME
        env:
          HOME_BACKEND_PATH: ${{ secrets.HOME_BACKEND_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/home_key -J ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} -o StrictHostKeyChecking=yes" \
            docker-compose.backend.yml \
            "${{ secrets.HOME_USER }}@${{ secrets.HOME_HOST }}:${HOME_BACKEND_PATH}/"

      - name: Rsync backend/ to HOME
        env:
          HOME_BACKEND_PATH: ${{ secrets.HOME_BACKEND_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/home_key -J ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} -o StrictHostKeyChecking=yes" \
            backend/ \
            "${{ secrets.HOME_USER }}@${{ secrets.HOME_HOST }}:${HOME_BACKEND_PATH}/backend/"

      - name: Docker Compose up on HOME
        env:
          HOME_BACKEND_PATH: ${{ secrets.HOME_BACKEND_PATH }}
        run: |
          ssh -i ~/.ssh/home_key -J "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "${{ secrets.HOME_USER }}@${{ secrets.HOME_HOST }}" "
              set -e
              cd '${HOME_BACKEND_PATH}'
              docker compose -f docker-compose.backend.yml pull || true
              docker compose -f docker-compose.backend.yml build --pull
              docker compose -f docker-compose.backend.yml up -d
              docker compose -f docker-compose.backend.yml ps
            "