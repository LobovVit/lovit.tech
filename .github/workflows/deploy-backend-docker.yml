name: Deploy Backend (Docker via VPS → Home)

on:
  push:
    branches: [ develop ]
    paths:
      - "backend/**"
      - "docker-compose.backend.yml"
      - ".github/workflows/deploy-backend-docker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # директория деплоя на домашнем сервере
      HOME_DEPLOY_DIR: /opt/lovit
      # путь compose-файла НА домашнем сервере
      HOME_COMPOSE_FILE: /opt/lovit/docker-compose.backend.yml
      # кастомный проект для docker compose (чтобы имена контейнеров были стабильны)
      COMPOSE_PROJECT: lovit-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ssh & rsync on runner
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client rsync

      - name: Prepare SSH (keys, config, known_hosts for VPS)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          HOME_HOST: ${{ secrets.HOME_HOST }}
          HOME_USER: ${{ secrets.HOME_USER }}
          HOME_PORT: ${{ secrets.HOME_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOME_SSH_KEY: ${{ secrets.HOME_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Ключи
          echo "$VPS_SSH_KEY"  > ~/.ssh/vps_key
          echo "$HOME_SSH_KEY" > ~/.ssh/home_key
          chmod 600 ~/.ssh/vps_key ~/.ssh/home_key

          # known_hosts для VPS (чтобы StrictHostKeyChecking не падал)
          ssh-keyscan -t ed25519 "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

          # SSH config c ProxyJump через VPS
          cat > ~/.ssh/config <<'CFG'
          Host vps
            HostName ${VPS_HOST}
            User ${VPS_USER}
            IdentityFile ~/.ssh/vps_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts

          Host home
            HostName ${HOME_HOST}
            User ${HOME_USER}
            Port ${HOME_PORT}
            IdentityFile ~/.ssh/home_key
            IdentitiesOnly yes
            ProxyJump vps
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          CFG

          # подставим переменные окружения в конфиг (простая подстановка)
          sed -i "s|\${VPS_HOST}|$VPS_HOST|g" ~/.ssh/config
          sed -i "s|\${VPS_USER}|$VPS_USER|g" ~/.ssh/config
          sed -i "s|\${HOME_HOST}|$HOME_HOST|g" ~/.ssh/config
          sed -i "s|\${HOME_USER}|$HOME_USER|g" ~/.ssh/config
          sed -i "s|\${HOME_PORT}|$HOME_PORT|g" ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Add HOME host key to known_hosts via VPS
        env:
          HOME_HOST: ${{ secrets.HOME_HOST }}
          HOME_SSH_PORT: ${{ secrets.HOME_SSH_PORT }}
        run: |
          # получаем публичный ключ домашнего хоста, но запускаем ssh-keyscan на VPS
          ssh -F ~/.ssh/config vps "ssh-keyscan -t ed25519 -p '${HOME_SSH_PORT}' '${HOME_HOST}' 2>/dev/null" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "Known_hosts entry for HOME:"
          grep "${HOME_HOST}" ~/.ssh/known_hosts || true

      - name: Sanity check SSH to VPS and HOME
        run: |
          ssh -F ~/.ssh/config vps  "echo '✅ VPS OK:'  \$(hostname)"
          ssh -F ~/.ssh/config home "echo '✅ HOME OK:' \$(hostname)"

      - name: Rsync compose & backend to HOME
        # Синхронизируем docker-compose.backend.yml из корня репозитория и папку backend/
        run: |
          ssh -F ~/.ssh/config home "sudo mkdir -p '${HOME_DEPLOY_DIR}' && sudo chown -R \$USER:\$USER '${HOME_DEPLOY_DIR}'"
          rsync -avz --delete -e "ssh -F ~/.ssh/config" \
            docker-compose.backend.yml \
            backend/ \
            home:"${HOME_DEPLOY_DIR}/"

      - name: Deploy on HOME (docker compose up -d --build)
        run: |
          ssh -F ~/.ssh/config home "
            cd '${HOME_DEPLOY_DIR}' && \
            docker compose -p '${COMPOSE_PROJECT}' -f '${HOME_COMPOSE_FILE}' pull && \
            docker compose -p '${COMPOSE_PROJECT}' -f '${HOME_COMPOSE_FILE}' up -d --build && \
            docker system prune -f
          "

      - name: Show compose status
        if: always()
        run: |
          ssh -F ~/.ssh/config home "
            cd '${HOME_DEPLOY_DIR}' && \
            docker compose -p '${COMPOSE_PROJECT}' -f '${HOME_COMPOSE_FILE}' ps && \
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          "