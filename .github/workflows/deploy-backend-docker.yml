name: Deploy Backend (Docker via VPS Jump)

on:
  push:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - 'docker-compose.backend.yml'
      - '.github/workflows/deploy-backend-docker.yml'

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install rsync & ssh client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rsync openssh-client

      - name: Prepare SSH keys
        env:
          VPS_SSH_KEY:  ${{ secrets.VPS_SSH_KEY }}
          HOME_SSH_KEY: ${{ secrets.HOME_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # VPS key
          echo "$VPS_SSH_KEY"  > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          # HOME key
          echo "$HOME_SSH_KEY" > ~/.ssh/home_key
          chmod 600 ~/.ssh/home_key

      - name: Verify SSH connectivity (VPS)
        run: |
          ssh -i ~/.ssh/vps_key \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo VPS OK: \$(hostname)"

      - name: Verify SSH connectivity (HOME via ProxyJump)
        env:
          HOME_SSH_PORT: ${{ secrets.HOME_SSH_PORT }}
        run: |
          PORT=${HOME_SSH_PORT:-22}
          ssh -i ~/.ssh/home_key \
            -J "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no \
            -p "$PORT" \
            "${{ secrets.HOME_USER }}@${{ secrets.HOME_HOST }}" \
            "echo HOME OK: \$(hostname)"

      - name: Ensure target directory on HOME
        env:
          HOME_SSH_PORT:     ${{ secrets.HOME_SSH_PORT }}
          HOME_BACKEND_PATH: ${{ secrets.HOME_BACKEND_PATH }}
        run: |
          PORT=${HOME_SSH_PORT:-22}
          ssh -i ~/.ssh/home_key \
            -J "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no \
            -p "$PORT" \
            "${{ secrets.HOME_USER }}@${{ secrets.HOME_HOST }}" \
            "mkdir -p '${HOME_BACKEND_PATH}'"

      - name: Rsync docker-compose file to HOME
        env:
          HOME_SSH_PORT:     ${{ secrets.HOME_SSH_PORT }}
          HOME_BACKEND_PATH: ${{ secrets.HOME_BACKEND_PATH }}
        run: |
          PORT=${HOME_SSH_PORT:-22}
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/home_key -J ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} -o IdentitiesOnly=yes -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -p $PORT" \
            docker-compose.backend.yml \
            "${{ secrets.HOME_USER }}@${{ secrets.HOME_HOST }}:${HOME_BACKEND_PATH}/"

      - name: Rsync backend/ sources to HOME
        env:
          HOME_SSH_PORT:     ${{ secrets.HOME_SSH_PORT }}
          HOME_BACKEND_PATH: ${{ secrets.HOME_BACKEND_PATH }}
        run: |
          PORT=${HOME_SSH_PORT:-22}
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/home_key -J ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} -o IdentitiesOnly=yes -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -p $PORT" \
            backend/ \
            "${{ secrets.HOME_USER }}@${{ secrets.HOME_HOST }}:${HOME_BACKEND_PATH}/backend/"

      - name: Docker Compose up on HOME
        env:
          HOME_SSH_PORT:     ${{ secrets.HOME_SSH_PORT }}
          HOME_BACKEND_PATH: ${{ secrets.HOME_BACKEND_PATH }}
        run: |
          PORT=${HOME_SSH_PORT:-22}
          ssh -i ~/.ssh/home_key \
            -J "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no \
            -p "$PORT" \
            "${{ secrets.HOME_USER }}@${{ secrets.HOME_HOST }}" "
              set -euxo pipefail
              cd '${HOME_BACKEND_PATH}'
              docker compose -f docker-compose.backend.yml pull || true
              docker compose -f docker-compose.backend.yml build --pull
              docker compose -f docker-compose.backend.yml up -d
              docker compose -f docker-compose.backend.yml ps
            "