name: Deploy Backend (Docker via VPS ProxyJump)

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - 'docker-compose.backend.yml'
      - '.github/workflows/deploy-backend-docker.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync and ssh-keyscan
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rsync openssh-client

      - name: Prepare SSH keys and config (ProxyJump)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Сохраняем приватные ключи
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}"  > ~/.ssh/vps_key
          printf '%s\n' "${{ secrets.HOME_SSH_KEY }}" > ~/.ssh/home_key
          chmod 600 ~/.ssh/vps_key ~/.ssh/home_key

          # known_hosts
          touch ~/.ssh/known_hosts
          ssh-keyscan -p 22 -T 10 ${{ secrets.VPS_HOST }}  >> ~/.ssh/known_hosts 2>/dev/null || true
          # Скан домашнего хоста через VPS, чтобы добавить его ключ
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "ssh-keyscan -p 22 -T 10 ${{ secrets.HOME_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          # SSH config (без кавычек у EOF — важна подстановка secrets)
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/vps_key
            ServerAliveInterval 30
            ServerAliveCountMax 6

          Host home
            HostName ${{ secrets.HOME_HOST }}
            User ${{ secrets.HOME_USER }}
            IdentityFile ~/.ssh/home_key
            ProxyJump vps
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF

          chmod 600 ~/.ssh/config
          echo "SSH config created:"
          ls -la ~/.ssh

      - name: Verify SSH connectivity (VPS and Home)
        run: |
          set -e
          ssh -F ~/.ssh/config -o StrictHostKeyChecking=yes vps "echo 'VPS OK: $(hostname)'" 
          ssh -F ~/.ssh/config -o StrictHostKeyChecking=yes home "echo 'HOME OK: $(hostname)'" 

      - name: Prepare remote target folder on HOME
        env:
          HOME_BACKEND_PATH: ${{ secrets.HOME_BACKEND_PATH }}
        run: |
          ssh -F ~/.ssh/config home "mkdir -p '${HOME_BACKEND_PATH}'"

      - name: Rsync backend files to HOME (via ProxyJump)
        env:
          HOME_BACKEND_PATH: ${{ secrets.HOME_BACKEND_PATH }}
        run: |
          # Синкаем docker-compose для бекенда и сам backend-код
          rsync -avz --delete -e "ssh -F ~/.ssh/config" \
            docker-compose.backend.yml \
            home:"${HOME_BACKEND_PATH}/"

          rsync -avz --delete -e "ssh -F ~/.ssh/config" \
            backend/ \
            home:"${HOME_BACKEND_PATH}/backend/"

      - name: Deploy on HOME with Docker Compose
        env:
          HOME_BACKEND_PATH: ${{ secrets.HOME_BACKEND_PATH }}
        run: |
          # Если нужен docker login к реестру — добавьте команду логина здесь.
          ssh -F ~/.ssh/config home "
            set -e
            cd '${HOME_BACKEND_PATH}'
            # Подтягиваем образы/пересобираем и поднимаем
            docker compose -f docker-compose.backend.yml pull || true
            docker compose -f docker-compose.backend.yml build --pull
            docker compose -f docker-compose.backend.yml up -d
            docker compose -f docker-compose.backend.yml ps
          "