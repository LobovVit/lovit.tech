name: Deploy Frontend (static)

on:
  push:
    branches: [ "develop" ]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync & ssh-client
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Prepare SSH (VPS)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync to VPS
        env:
          SRC_DIR: frontend/
          DEST: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}
        run: |
          rsync -avz --delete \
            --exclude '.git*' \
            --exclude 'node_modules' \
            --exclude '.DS_Store' \
            -e "ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=yes" \
            "$SRC_DIR" "$DEST"

      - name: Fix perms & reload Nginx on VPS (optional)
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo mkdir -p '${{ secrets.VPS_PATH }}' && \
             sudo chown -R www-data:www-data '${{ secrets.VPS_PATH }}' || true && \
             if command -v systemctl >/dev/null 2>&1; then sudo systemctl reload nginx || true; fi"
