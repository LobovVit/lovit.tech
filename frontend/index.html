<!doctype html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>lovit.tech</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
    <a class="brand" href="/" aria-label="lovit.tech">
        <img id="logo" class="logo" src="images/logo-light.png" alt="LV logo" />
    </a>

    <div class="header-actions">
        <button class="chip tile" data-target="adv" title="Реклама">📣</button>
        <button class="chip tile" data-target="audit" title="Аудит">🖊️</button>
        <button class="chip tile" data-target="sites" title="Сайты">🧩</button>
        <button class="chip tile" data-target="mobile" title="Мобильные">📱</button>

        <button id="theme-toggle" class="chip chip--wide" type="button" aria-label="Сменить тему">…</button>
        <button id="login-btn" class="chip chip--wide" type="button">Войти</button>
    </div>
</header>

<main>
    <section id="adv" class="section-block"><h2>Реклама</h2><p>Контент блока.</p></section>
    <section id="audit" class="section-block"><h2>Аудит рекламных кампаний</h2><p>Контент блока.</p></section>
    <section id="sites" class="section-block"><h2>Сайты</h2><p>Контент блока.</p></section>
    <section id="mobile" class="section-block"><h2>Мобильные приложения</h2><p>Контент блока.</p></section>
</main>

<!-- Модалка авторизации -->
<div id="auth-modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal__dialog">
        <button id="auth-close" class="modal__close" aria-label="Закрыть">✕</button>

        <div class="tabs" role="tablist">
            <button class="tab active" data-tab="login"  role="tab" aria-selected="true">Вход</button>
            <button class="tab"         data-tab="signup" role="tab" aria-selected="false">Регистрация</button>
        </div>

        <form id="form-login" class="form active" autocomplete="on">
            <div class="field">
                <label for="login-email">E-mail</label>
                <input id="login-email" type="email" name="email" placeholder="you@example.com" required />
            </div>
            <div class="field">
                <label for="login-pass">Пароль</label>
                <input id="login-pass" type="password" name="password" placeholder="••••••••" required />
            </div>
            <button class="btn btn-primary btn-full" type="submit">Войти</button>
            <div class="form-hint">Нет аккаунта?
                <a href="#" data-tab-switch="signup">Зарегистрироваться</a>
            </div>
        </form>

        <form id="form-signup" class="form" autocomplete="on">
            <div class="field">
                <label for="signup-name">Имя</label>
                <input id="signup-name" type="text" name="name" placeholder="Ваше имя" required />
            </div>
            <div class="field">
                <label for="signup-email">E-mail</label>
                <input id="signup-email" type="email" name="email" placeholder="you@example.com" required />
            </div>
            <div class="field">
                <label for="signup-pass">Пароль</label>
                <input id="signup-pass" type="password" name="password" placeholder="Минимум 6 символов" required />
            </div>
            <button class="btn btn-primary btn-full" type="submit">Создать аккаунт</button>
            <div class="form-hint">Уже есть аккаунт?
                <a href="#" data-tab-switch="login">Войти</a>
            </div>
        </form>

        <div id="auth-message" class="auth-message" aria-live="polite"></div>
    </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
