<!doctype html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LV</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
    <h1>LV</h1>

    <div class="tiles" aria-label="Навигация по разделам">
        <div class="tile" data-target="adv">📣</div>
        <div class="tile" data-target="audit">🧪</div>
        <div class="tile" data-target="sites">🧩</div>
        <div class="tile" data-target="mobile">📱</div>
    </div>

    <div class="header-actions">
        <button id="theme-toggle" title="Переключить тему">🌓</button>
        <button id="login-btn" class="btn btn-primary" data-open-auth data-tab="login">Войти</button>
    </div>
</header>

<main>
    <section id="adv" class="section-block">
        <h2>Реклама</h2>
        <p>Запуск и оптимизация кампаний.</p>
    </section>

    <section id="audit" class="section-block">
        <h2>Аудит рекламных кампаний</h2>
        <p>Разбор и рекомендации.</p>
    </section>

    <section id="sites" class="section-block">
        <h2>Сайты</h2>
        <p>Продуманные веб-продукты под задачи.</p>
    </section>

    <section id="mobile" class="section-block">
        <h2>Мобильные приложения</h2>
        <p>iOS/Android — дизайн, разработка, публикация.</p>
    </section>
</main>

<!-- Модалка авторизации -->
<div id="auth-modal" class="modal" aria-hidden="true" aria-modal="true" role="dialog">
    <div class="modal__dialog">
        <button id="auth-close" class="modal__close" aria-label="Закрыть">✕</button>
        <h3 style="margin:0 0 .5rem;">Аккаунт</h3>

        <div class="tabs" role="tablist">
            <button
                    class="tab active"
                    role="tab"
                    aria-selected="true"
                    data-tab="login"
                    data-tab-switch="login"
            >Вход</button>

            <button
                    class="tab"
                    role="tab"
                    aria-selected="false"
                    data-tab="signup"
                    data-tab-switch="signup"
            >Регистрация</button>
        </div>

        <!-- Форма входа -->
        <form id="form-login" class="form active" novalidate>
            <div class="field">
                <label for="login-email">E-mail</label>
                <input id="login-email" name="email" type="email" placeholder="you@example.com" required />
            </div>
            <div class="field">
                <label for="login-pass">Пароль</label>
                <input id="login-pass" name="password" type="password" placeholder="••••••••" required />
            </div>
            <button class="btn btn-primary btn-full" type="submit">Войти</button>
            <p class="form-hint">
                Нет аккаунта?
                <a href="#" data-tab-switch="signup">Создать</a>
            </p>
        </form>

        <!-- Форма регистрации -->
        <form id="form-signup" class="form" novalidate>
            <div class="field">
                <label for="su-name">Имя</label>
                <input id="su-name" name="name" type="text" placeholder="Иван Иванов" required />
            </div>
            <div class="field">
                <label for="su-email">E-mail</label>
                <input id="su-email" name="email" type="email" placeholder="you@example.com" required />
            </div>
            <div class="field">
                <label for="su-pass">Пароль</label>
                <input id="su-pass" name="password" type="password" placeholder="минимум 6 символов" required />
            </div>
            <button class="btn btn-primary btn-full" type="submit">Создать аккаунт</button>
            <p class="form-hint">
                Уже есть аккаунт?
                <a href="#" data-tab-switch="login">Войти</a>
            </p>
        </form>

        <div id="auth-message" class="auth-message"></div>
    </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
