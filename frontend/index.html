<!doctype html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lovit.tech</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- фон -->
<div id="bg" aria-hidden="true"></div>

<!-- header -->
<header class="site-header">
    <div class="header-left">
        <a class="logo" href="/">
            <img id="logoImg" src="images/logo-light.png" alt="LV" />
        </a>
        <div class="brand">
            <span class="brand-text">Digital-studia LV</span>
        </div>
    </div>

    <nav class="header-actions" aria-label="Главная навигация">
        <!-- Навигация по блокам -->
        <button class="pill" data-goto="block-ads">Реклама</button>
        <button class="pill" data-goto="block-audit">Аудит</button>
        <button class="pill" data-goto="block-sites">Сайты</button>
        <button class="pill" data-goto="block-mobile">Мобильные</button>

        <!-- разделитель фиксированной ширины -->
        <div class="spacer" aria-hidden="true"></div>

        <!-- Соцсети — тоже pill -->
<!--        <a class="pill" href="https://t.me/your_telegram" target="_blank" rel="noopener">Telegram</a>-->
<!--        <a class="pill" href="https://wa.me/79990000000" target="_blank" rel="noopener">WhatsApp</a>-->
        <a href="https://t.me/yourchannel" target="_blank" class="chip icon-btn" aria-label="Telegram">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon">
                <path d="M9.999 15.2L9.9 18.9c.4 0 .6-.2.9-.4l2.1-2 4.3 3.2c.8.5 1.4.3 1.6-.8l3-13.8c.3-1.2-.4-1.7-1.2-1.4L2.9 9.3c-1.2.5-1.2 1.2-.2 1.5l4.3 1.3 10-6.3c.5-.3.9-.1.5.2l-8.6 8.3z"/>
            </svg>
        </a>

        <a href="https://wa.me/79991234567" target="_blank" class="chip icon-btn" aria-label="WhatsApp">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="currentColor" class="icon">
                <path d="M380.9 97.1C339-3.9 215.5-32.3 121.1 28.5 37.5 85.5 6.7 187.4 50.2 278.2L7.4 466.6l192.5-50.6c86.5 36.8 187.3 1.5 243.5-84.3 59.8-92.3 31.7-216-62.5-234.6zM222.3 347.7c-29.3 0-58.1-7.9-83.2-22.8l-5.9-3.5-49.4 13 13.2-48.2-3.8-6.2c-15.6-25.6-23.8-55.1-23.8-85.5 0-88.5 72-160.5 160.6-160.5 42.9 0 83.2 16.7 113.5 47 30.3 30.3 47 70.6 47 113.4 0 88.6-72 160.6-160.6 160.6zm89.2-118.4c-4.9-2.4-29-14.3-33.5-15.9-4.5-1.7-7.8-2.4-11.1 2.4s-12.7 15.9-15.6 19.1c-2.9 3.2-5.7 3.6-10.6 1.2-29.3-14.6-48.6-26.1-68-59-5.1-8.8 5.1-8.1 14.6-27 1.6-3.2.8-5.9-.5-8.3-1.3-2.4-11.1-26.8-15.2-36.8-4-9.7-8.1-8.4-11.1-8.6-2.9-.1-6.2-.1-9.5-.1s-8.3 1.2-12.7 5.9c-4.5 4.9-17.3 16.9-17.3 41.1s17.7 47.7 20.1 51c2.4 3.2 34.7 53 84.1 74.3 49.4 21.2 49.4 14.1 58.3 13.3 8.9-.8 29-11.8 33.1-23.3 4-11.6 4-21.5 2.8-23.3-1.2-1.7-4.4-2.9-9.3-5.3z"/>
            </svg>
        </a>

        <!-- смена темы как pill с иконкой -->
        <button id="themeToggle" class="pill pill-icon" title="Сменить тему" aria-label="Сменить тему">
            <span class="icon theme" aria-hidden="true"></span>
        </button>

        <!-- войти как pill с иконкой -->
        <button id="openAuth" class="pill pill-icon" title="Войти">
            <span class="icon user" aria-hidden="true"></span>
            <span class="pill-label">Войти</span>
        </button>
    </nav>
</header>

<!-- контент -->
<main class="content">
    <section class="tiles">
        <a class="tile" style="--i:0" data-goto="block-ads"><h3>Реклама</h3><p>Контент блока «Реклама»</p></a>
        <a class="tile" style="--i:1" data-goto="block-audit"><h3>Аудит рекламных кампаний</h3><p>Контент блока «Аудит»</p></a>
        <a class="tile" style="--i:2" data-goto="block-sites"><h3>Сайты</h3><p>Контент блока «Сайты»</p></a>
        <a class="tile" style="--i:3" data-goto="block-mobile"><h3>Мобильные приложения</h3><p>Контент блока «Мобильные»</p></a>
    </section>

    <section id="block-ads" class="block"><h2>Реклама</h2><p>…</p></section>
    <section id="block-audit" class="block"><h2>Аудит</h2><p>…</p></section>
    <section id="block-sites" class="block"><h2>Сайты</h2><p>…</p></section>
    <section id="block-mobile" class="block"><h2>Мобильные приложения</h2><p>…</p></section>
</main>

<!-- модалка авторизации -->
<div id="authModal" class="modal" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <div class="modal__header">
            <h3 id="authTitle">Аккаунт</h3>
            <button class="pill pill-icon" data-close title="Закрыть">
                <span class="icon close" aria-hidden="true"></span>
            </button>
        </div>

        <div class="tabs" role="tablist">
            <button class="tab active" data-tab="login" role="tab" aria-selected="true">Вход</button>
            <button class="tab" data-tab="signup" role="tab" aria-selected="false">Регистрация</button>
        </div>

        <div class="tabpanes">
            <form id="pane-login" class="pane active">
                <label> Email <input type="email" placeholder="you@email.com" required /></label>
                <label> Пароль <input type="password" placeholder="••••••••" required /></label>
                <button class="pill wide" type="submit">Войти</button>
            </form>

            <form id="pane-signup" class="pane">
                <label> Email <input type="email" placeholder="you@email.com" required /></label>
                <label> Пароль <input type="password" placeholder="Минимум 8 символов" required /></label>
                <button class="pill wide" type="submit">Зарегистрироваться</button>
            </form>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
